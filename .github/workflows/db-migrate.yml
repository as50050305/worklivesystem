name: DB migrations

# （選用）supabase/migrations 有變動並推到 main 時，自動套用到雲端資料庫。
# 需在 GitHub repo → Settings → Secrets and variables → Actions 設定：
#   SUPABASE_ACCESS_TOKEN  （https://supabase.com/dashboard/account/tokens）
#   SUPABASE_DB_PASSWORD   （建立專案時設定的資料庫密碼）
#   SUPABASE_PROJECT_REF   （專案網址 https://<ref>.supabase.co 的 <ref>）
# 沒設定 secrets 時此流程會直接略過。
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when secrets are missing
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "未設定 secrets，略過"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          version: latest
      - if: steps.gate.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
