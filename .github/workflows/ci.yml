name: CI

# 每次 push／PR 都跑型別檢查、單元測試與建置。
# 部署由 Vercel 的 GitHub 整合負責（push 到 main 自動部署）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 檢查 Mac 腳本（bash 3.2 相容）
        run: bash packaging/check-shell.sh
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
